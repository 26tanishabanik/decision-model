name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU)
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q tests
